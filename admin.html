<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Aleppo Cafe · CMS</title>
<link rel="icon" type="image/x-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">حلب<span>Aleppo Cafe</span></div>
    <div class="login-title">Content Management</div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary" style="width:100%">Sign in</button>
    </form>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="topbar">
    <div class="brand">حلب <small>Aleppo CMS</small></div>
    <div class="topbar-right">
      <a href="index.html" target="_blank" rel="noopener">View site ↗</a>
      <span id="user-email"></span>
      <button id="logout" class="btn ghost sm">Log out</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="view"></main>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/default-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
